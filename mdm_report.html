<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Expense Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-lg rounded-xl p-10 w-full max-w-3xl">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">💰 Monthly Expense Tracker</h1>
    <p class="text-center text-gray-500 mb-8">Enter your actual spending amounts below</p>

    <!-- Input Form -->
    <form id="expenseForm" class="space-y-4">
      <div>
        <label class="block text-gray-700 font-semibold">Total Budget (₹)</label>
        <input type="number" id="budgetInput" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-300" placeholder="Enter total budget">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold">🍔 Food (₹)</label>
        <input type="number" id="foodInput" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-green-300" placeholder="Enter amount spent on Food">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold">🚗 Transport (₹)</label>
        <input type="number" id="transportInput" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-300" placeholder="Enter amount spent on Transport">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold">🎮 Entertainment (₹)</label>
        <input type="number" id="entertainmentInput" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-purple-300" placeholder="Enter amount spent on Entertainment">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold">💰 Savings (₹)</label>
        <input type="number" id="savingsInput" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-yellow-300" placeholder="Enter amount saved">
      </div>

      <button type="button" onclick="updateBars()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg mt-4 w-full transition">
        Show My Expense Bars
      </button>
    </form>

    <!-- Progress Bars -->
    <div id="barsSection" class="mt-10 space-y-6 hidden">
      <div>
        <div class="flex justify-between mb-1">
          <span>🍔 Food</span><span id="foodPercent">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-6">
          <div id="foodBar" class="bg-gradient-to-r from-green-300 to-green-500 h-6 rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <div>
        <div class="flex justify-between mb-1">
          <span>🚗 Transport</span><span id="transportPercent">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-6">
          <div id="transportBar" class="bg-gradient-to-r from-blue-300 to-blue-500 h-6 rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <div>
        <div class="flex justify-between mb-1">
          <span>🎮 Entertainment</span><span id="entertainmentPercent">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-6">
          <div id="entertainmentBar" class="bg-gradient-to-r from-purple-300 to-purple-500 h-6 rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <div>
        <div class="flex justify-between mb-1">
          <span>💰 Savings</span><span id="savingsPercent">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-6">
          <div id="savingsBar" class="bg-gradient-to-r from-yellow-300 to-yellow-500 h-6 rounded-full" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateBars() {
      let budget = document.getElementById("budgetInput").value || 1;
      let food = document.getElementById("foodInput").value || 0;
      let transport = document.getElementById("transportInput").value || 0;
      let entertainment = document.getElementById("entertainmentInput").value || 0;
      let savings = document.getElementById("savingsInput").value || 0;

      let foodPercent = ((food / budget) * 100).toFixed(1);
      let transportPercent = ((transport / budget) * 100).toFixed(1);
      let entertainmentPercent = ((entertainment / budget) * 100).toFixed(1);
      let savingsPercent = ((savings / budget) * 100).toFixed(1);

      document.getElementById("foodBar").style.width = foodPercent + "%";
      document.getElementById("transportBar").style.width = transportPercent + "%";
      document.getElementById("entertainmentBar").style.width = entertainmentPercent + "%";
      document.getElementById("savingsBar").style.width = savingsPercent + "%";

      document.getElementById("foodPercent").innerText = foodPercent + "%";
      document.getElementById("transportPercent").innerText = transportPercent + "%";
      document.getElementById("entertainmentPercent").innerText = entertainmentPercent + "%";
      document.getElementById("savingsPercent").innerText = savingsPercent + "%";

      document.getElementById("barsSection").classList.remove("hidden");
    }
  </script>

</body>
</html>
